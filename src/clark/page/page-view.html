* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--grey-50); color: var(--text); font: var(--weight-light) var(--size-body)/var(--leading) var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--status-blue-text); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.again { min-height: 36px; padding: 0 16px; border: 1px solid var(--brand-blue); border-radius: var(--radius); background: var(--brand-blue); color: var(--text-on-brand); font-size: var(--size-body); cursor: pointer; }
.again:focus-visible { outline: 2px solid var(--brand-navy); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 30; height: var(--topbar); background: var(--brand-navy); color: var(--white); display: flex; align-items: center; gap: 18px; padding: 0 20px; }
.logo { display: inline-flex; align-items: center; }
.logo-icon { display: var(--logo-icon); width: 28px; height: 28px; margin-right: 8px; background: center / contain no-repeat; }   
.logo .wm { font-weight: var(--weight-medium); font-size: var(--size-h2); letter-spacing: .02em; }
.top .divider { width: 1px; height: 26px; background: rgba(255,255,255,.2); }
.proj { font-size: 14px; color: rgba(255,255,255,.85); }
.tabs { display: flex; height: 100%; }
.asat { margin-left: auto; font-size: 13px; color: rgba(255,255,255,.75); }
.tab { all: unset; position: relative; display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: rgba(255,255,255,.75); cursor: pointer; transition: color var(--dur-instant) var(--ease-out); }
.tab:hover { color: var(--white); }
.tab:focus-visible { outline: 2px solid var(--brand-cyan); outline-offset: -8px; border-radius: 6px; }
.tab[aria-selected="true"] { color: var(--white); font-weight: 400; }
.tab::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand-cyan); transform: scaleX(0); transition: transform var(--dur-state) var(--ease-out); }
.tab[aria-selected="true"]::after { transform: scaleX(1); }


main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 96px; }
.frame { width: 100%; background: var(--surface); border: 1px solid var(--grey-200); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px 28px; }
.frame h1 { margin: 0 0 12px; font-size: var(--size-h1); line-height: 1.2; font-weight: var(--weight-medium); color: var(--heading); }
.crumbs { margin: 0 0 2px; font-size: var(--size-small); color: var(--text-muted); }
.glance { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.tile { display: flex; flex-direction: column; }
.tile .n { font-size: 22px; font-weight: var(--weight-medium); color: var(--heading); }
.tile .l { font-size: var(--size-small); color: var(--text-muted); }

.tcell { position: relative; display: flex; flex: 0 0 190px; min-width: 0; }
.tcell.health { flex: 0 0 392px; }
.fig { position: relative; display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 12px 16px; border: 1px solid var(--grey-200); border-radius: var(--radius); background: var(--surface); font: inherit; text-align: left; color: inherit; }
.fig::after { content: ""; position: absolute; inset: -1px; border: 2px solid transparent; border-radius: inherit; pointer-events: none; -webkit-mask-image: linear-gradient(45deg, currentColor 0%, transparent 75%); mask-image: linear-gradient(45deg, currentColor 0%, transparent 75%); }
.fig.rag-g::after { border-color: var(--status-green); } .fig.rag-a::after { border-color: var(--status-amber); } .fig.rag-r::after { border-color: var(--status-red); }
.fig .k { display: flex; align-items: center; gap: 6px; font-size: var(--size-small); color: var(--text-muted); }
.fig .v { font-size: 22px; font-weight: var(--weight-medium); color: var(--heading); }
.fig .dd { font-size: var(--size-small); color: var(--text-muted); }
.fig .tw { font-size: var(--size-small); color: var(--text); }
.fig .hrow { display: flex; align-items: flex-start; gap: 12px; margin-top: 4px; }
.fig .hrow .dd { font-size: inherit; color: inherit; }
.fig .hreason { flex: 1 1 auto; min-width: 0; font-size: var(--size-body); color: var(--text); white-space: pre-line; overflow-wrap: anywhere; }
.fig textarea.hreason { width: 100%; min-height: 62px; padding: 4px 8px; border: 1px solid var(--grey-300); border-radius: var(--radius-sm); background: var(--surface); font: inherit; resize: vertical; white-space: pre-wrap; }
.fig textarea.hreason.needs { border-color: var(--status-amber); }
.fig textarea.hreason:focus-visible, .pillbtn:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; }
button.pillbtn { min-height: 28px; border: 0; cursor: pointer; font: inherit; font-size: 13px; }
.glance .fig.go { cursor: pointer; transition: border-color var(--dur-instant) var(--ease-out), box-shadow var(--dur-state) var(--ease-out); }
.glance .fig.go:hover { border-color: var(--brand-blue); box-shadow: var(--shadow); }
.glance .fig.go:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; }

.tgrip, .teye { all: unset; box-sizing: border-box; position: absolute; top: 4px; z-index: 2; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; }
.tgrip { right: 30px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.teye { right: 4px; }
.teye .i { width: 16px; height: 16px; }
.tgrip:hover, .teye:hover { background: var(--grey-100); color: var(--text); }
.tgrip:focus-visible, .teye:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 1px; }
.tcell.is-hidden .fig { border-style: dashed; border-color: var(--grey-300); background: var(--grey-100); }   
.thid { position: absolute; left: 12px; bottom: 6px; z-index: 2; }
.tcell.drop-left::before, .tcell.drop-right::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--brand-cyan); z-index: 3; }
.tcell.drop-left::before { left: -8px; } .tcell.drop-right::before { right: -8px; }
.tilemenu { top: 30px; right: auto; left: 0; }
.ddmenu [role="menuitemradio"] { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 8px 14px; cursor: pointer; font-size: 14px; color: var(--text); }
.ddmenu [role="menuitemradio"]:hover, .ddmenu [role="menuitemradio"]:focus-visible { background: var(--brand-blue-tint); color: var(--status-blue-text); }
.ragdot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-grey); }
.rag-g .ragdot { background: var(--status-green); } .rag-a .ragdot { background: var(--status-amber); } .rag-r .ragdot { background: var(--status-red); }
.tile .l { font-size: var(--size-small); color: var(--text-muted); }
ul.plain { margin: 0; padding: 0; list-style: none; }
ul.plain li { padding: 6px 0; border-top: 1px solid var(--grey-100); }
@media (max-width: 900px) { main { padding: 20px 16px 72px; } .frame { padding: 18px 16px; } .proj { display: none; } }


.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.toc { position: fixed; right: 6px; top: 50%; transform: translateY(-50%); z-index: 25; }
.toc-lines { all: unset; display: grid; align-content: center; min-height: 24px; box-sizing: border-box; gap: 7px; justify-items: end; padding: 10px 4px 10px 14px; cursor: pointer; border-radius: var(--radius); }
.toc-lines:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.toc-lines i { display: block; width: 12px; height: 2px; border-radius: 2px; background: var(--grey-700); transition: width var(--dur-state) var(--ease-out), background-color var(--dur-state) var(--ease-out); }
.toc-lines i.on { width: 20px; background: var(--heading); }
.toc-card { position: absolute; right: 0; top: 50%; width: min(250px, calc(100vw - 32px)); padding: 12px 10px 10px; background: var(--surface); border: 1px solid var(--grey-200); border-radius: var(--radius-lg); box-shadow: var(--shadow); font-size: var(--size-small); opacity: 0; visibility: hidden; transform: translate(8px, -50%); transition: opacity var(--dur-state) var(--ease-exit), transform var(--dur-state) var(--ease-exit), visibility 0s var(--dur-state); }
.toc.open .toc-card { opacity: 1; visibility: visible; transform: translate(0, -50%); transition: opacity var(--dur-state) var(--ease-enter), transform var(--dur-state) var(--ease-enter), visibility 0s; }
.toc.open .toc-lines { opacity: 0; }
.toc-h { margin: 0 8px 6px; font-size: var(--size-small); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); font-weight: var(--weight-medium); }
.toc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc li button { all: unset; box-sizing: border-box; display: flex; align-items: center; width: 100%; min-height: 24px; padding: 5px 8px; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; }
.toc li button:hover { color: var(--text); background: var(--grey-100); }
.toc li button.on { color: var(--heading); font-weight: var(--weight-medium); }
.toc li button:focus-visible { outline: 2px solid var(--focus); }


.picker { display: flex; flex-direction: column; width: min(640px, 100%); max-height: min(560px, 90vh); background: var(--surface); border: 1px solid var(--grey-200); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.pk-head { padding: 16px 20px 8px; }
.pk-head h2 { margin: 0; font-size: var(--size-h3); font-weight: var(--weight-medium); color: var(--heading); }
.pk-head p { margin: 2px 0 0; }
.pk-search { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px; }
.pk-q { flex: 1 1 200px; min-width: 0; }
.pk-q input { width: 100%; min-height: 32px; padding: 4px 10px; border: 1px solid var(--grey-300); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.pk-q input:focus-visible, .pick input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.pk-btn { min-height: 32px; min-width: 24px; padding: 4px 12px; border: 1px solid var(--grey-300); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; }
.pk-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pk-btn:disabled { color: var(--text-muted); cursor: default; }

.personal { margin-top: 16px; }
.personal h2 { margin: 0 0 4px; font-size: var(--size-h2); font-weight: var(--weight-medium); color: var(--heading); }
.styles { border: 0; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.styles legend { padding: 0; margin-bottom: 6px; font-size: var(--size-small); color: var(--text-muted); }
.stylepick { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.stylepick input { accent-color: var(--brand-blue); width: 16px; height: 16px; margin-top: 3px; }
.fld { display: grid; gap: 4px; margin: 0 0 12px; max-width: 420px; }
.fld label { font-size: var(--size-body); font-weight: var(--weight-medium); color: var(--text); }
.fld input { min-height: 36px; padding: 4px 10px; border: 1px solid var(--grey-300); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.fld input:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 1px; }
.fld input[aria-invalid="true"] { border-color: var(--status-red-text); }
.fld small { color: var(--text-muted); font-size: var(--size-small); }
.fld-bad { margin: 0; min-height: 0; color: var(--status-red-text); font-size: var(--size-small); }
.fld-bad:empty { display: none; }
.stylepick small { display: block; color: var(--text-muted); font-size: var(--size-small); }
html[data-secstyle="roomy"] .secs { gap: 36px 32px; margin-top: 28px; }
html[data-secstyle="roomy"] .sec { padding: 20px 0 8px; }
html[data-secstyle="grey"] .sec { border-top: 0; padding-top: 0; }
html[data-secstyle="grey"] .sec-head { padding: 6px 10px; border-radius: var(--radius-sm); background: var(--grey-100); }
html[data-secstyle="card"] .secs { padding: 4px 20px 12px; border: 1px solid var(--grey-200); border-radius: var(--radius-lg); background: var(--surface); }


.rt { position: relative; margin: 8px 0; border: 1px solid var(--grey-300); border-radius: var(--radius-lg); background: var(--surface); }
.rt:focus-within { border-color: var(--brand-blue); box-shadow: 0 0 0 2px var(--brand-blue-tint); }
.rt-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.rt-btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: var(--radius-sm); font-size: var(--size-small); color: var(--text); cursor: pointer; }
.rt-btn:hover { background: var(--grey-100); }
.rt-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.rt-btn.on { background: var(--brand-blue-tint); color: var(--brand-blue); }
.rt-style { min-width: 96px; justify-content: space-between; gap: 6px; }
.rt-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--border); }
.rt-keys { margin-left: auto; padding-left: 8px; font-size: var(--size-small); color: var(--text-muted); }
.rt-host { min-height: 80px; padding: 8px 12px; }
.rt-host .ProseMirror { outline: none; min-height: 64px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; font-variant-ligatures: none; }
.rt-host .ProseMirror p { margin: 0 0 10px; }
.rt-host .ProseMirror ul, .rt-host .ProseMirror ol { margin: 0 0 10px; padding-left: 22px; }
.rt-host .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
.rt-host .ProseMirror li[data-type="taskItem"] { display: flex; gap: 8px; align-items: flex-start; }
.rt-host .ProseMirror li[data-type="taskItem"] > label { flex: none; padding-top: 2px; }
.rt-host .ProseMirror li[data-type="taskItem"] > div { flex: 1; min-width: 0; }
.rt-host .ProseMirror a { color: var(--link); }
.rt-host .ProseMirror blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--grey-200); }
.rt-host .ProseMirror hr { border: 0; border-top: 1px solid var(--grey-300); margin: 12px 0; }
.rt-host .ProseMirror-selectednode { outline: 2px solid var(--brand-blue); }
.rt-link { display: flex; gap: 6px; align-items: center; padding: 6px; border-bottom: 1px solid var(--border); }
.rt-link input { flex: 1; min-width: 0; height: 32px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--grey-300); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: inherit; }
.rt-problem { margin: 0; padding: 6px 12px 8px; font-size: var(--size-small); color: var(--status-red-text); }
.rt-bubble, .rt-slash { position: fixed; z-index: 30; display: flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.rt-slash { flex-direction: column; min-width: 180px; max-width: calc(100vw - 16px); max-height: 50vh; overflow-y: auto; padding: 4px 0; }
.rt-opt { all: unset; box-sizing: border-box; display: block; padding: 8px 14px; font-size: 14px; color: var(--text); cursor: pointer; }
.rt-opt:hover, .rt-opt.on { background: var(--grey-100); }
.rt-view { border-radius: var(--radius-sm); cursor: text; }
.rt-view:hover { outline: 1px solid var(--grey-300); }
.rt-view:focus-visible { outline: 2px solid var(--focus); }



.again, .btn.primary { border: 0; border-radius: var(--radius-pill); padding: 0 22px; min-height: 38px; font-weight: 800; letter-spacing: .04em;
  background-color: var(--pill-color); background-image: var(--pill-bg); color: var(--pill-fg); box-shadow: var(--pill-glow); transition: transform var(--dur-state) var(--ease-out), box-shadow var(--dur-state) var(--ease-out); }
.again:hover, .btn.primary:hover { transform: translateY(-1px); box-shadow: var(--pill-glow-hover); }
.btn, .seg { border-radius: var(--radius-pill); }
.btn { padding-left: 18px; padding-right: 18px; }
.seg button[aria-pressed="true"] { background-color: var(--pill-color); background-image: var(--pill-bg); color: var(--pill-fg); font-weight: 700; }
.seg button[aria-pressed="true"] em { color: var(--pill-fg); }
.top { background-color: var(--brand-navy); background-image: linear-gradient(90deg, var(--brand-navy), var(--bar-end)); }   
.tab::after { background-color: var(--pill-color); background-image: var(--accent-line); }


@media (prefers-reduced-motion: reduce) { .again, .btn.primary { transition: none; } .again:hover, .btn.primary:hover { transform: none; } }


h1, h2, h3, .fig .v, .tile .n { font-family: var(--font-head); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.crumbs { font-family: var(--font-label); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
.fig .k, .tile .l { font-family: var(--font-label); font-weight: 600; }
.tab, .proj { font-family: var(--font-label); font-weight: 500; }


.frame.empty::before { content: ""; display: block; height: var(--art-home-height); background: var(--art-home) center / contain no-repeat; }
.ddmenu .ck { display: inline-block; width: 1.2em; margin-right: 4px; color: var(--status-blue-text); }
